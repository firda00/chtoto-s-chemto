[project]
name = "bank-statement-auditor"
version = "0.1.0"
description = "Smart Subscription & Bank Statement Auditor: парсинг выписок (CSV/PDF), категоризация трат, поиск забытых подписок"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "openai>=1.40",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.scripts]
audit = "bank_auditor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108"]  # B008: typer.Option в дефолтах — норма для typer
