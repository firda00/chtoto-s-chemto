[project]
name = "chess-analyzer"
version = "0.1.0"
description = "Chess Match Analyzer & Mistake Explainer: PGN -> Stockfish eval -> LLM explanations of tactical mistakes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "pydantic>=2.7",
    "typer>=0.12",
    "openai>=1.40",
    "rich>=13.7",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
chess = "chess_analyzer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stockfish: requires a real Stockfish binary (STOCKFISH_PATH)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option/Argument в значениях по умолчанию — идиома typer
