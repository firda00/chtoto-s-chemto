[project]
name = "local-llm"
version = "0.1.0"
description = "Запуск, бенчмарк и оптимизация локальных LLM (Qwen, Llama) через Ollama и vLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
llm = "local_llm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm"]

[tool.hatch.build.targets.wheel.force-include]
"presets" = "local_llm/_presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/local_llm/cli.py" = ["B008"]
"scripts/*.py" = ["E501"]
