[project]
name = "ats-resume-tailor"
version = "0.1.0"
description = "ATS Score резюме относительно вакансии и адаптация резюме под платформы найма (LinkedIn, Indeed, hh.ru)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "scikit-learn>=1.5",
    "rich>=13.7",
]

[project.scripts]
ats = "ats_tailor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_tailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: длину кода держит `ruff format`; длинными остаются только строки-промпты на русском
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
